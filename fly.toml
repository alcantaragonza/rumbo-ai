app = "rumbo-ai"
primary_region = "ord"

[build]

[env]
  # Producción: GROQ_API_KEY y SESSION_SECRET se configuran como secretos de Fly.
  ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  release_command = ".venv/bin/alembic upgrade head"
